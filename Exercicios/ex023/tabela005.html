<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Tabela</title>
    <link rel="stylesheet" href="tabela005.css">
</head>
<body>

            <col class="csexo">
            <col class="ccidade">

            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Ana Maria</td>

            <td>25</td>

        </tr>
        <tr>
            <td>Gabriel</td>
            <td>M</td>
            <td>30</td>
            <td>Arquiteto</td>
        </tr>
        <tr>
            <td>José</td>
            <td>M</td>
            <td>40</td>
            <td>Médico</td>
        </tr>
        <tr>
            <td>Gustavo</td>
            <td>M</td>
            <td>42</td>
            <td>Professor</td>
        </tr>
        <tr>
            <td>Maria</td>
            <td>F</td>
            <td>39</td>
            <td>Média</td>
        </tr>
        <tr>
            <td>Julia</td>
            <td>F</td>
            <td>28</td>
            <td>Programadora</td>
        </tr>
    </table>
</body>
</html>
