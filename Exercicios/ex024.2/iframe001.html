<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe {
            width: 400px;
            height: 400px;
            border: 1px solid;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>Acessando o site do CursoemVideo <iframe src="https://cursoemvideo.com" frameborder="0" scolling="no"></iframe> para aprender a programar</p>

    <p>
        o repositório do Guanabara
        <!--Tamanho padrão de um iframe é 300x150px-->
        <iframe src="https://gustavoguanabara.github.io" frameborder="0"> no
            <a href="https://gustavoguanabara.github.io" target="_blank">GitHub</a>
        </iframe>

        também é bem legal!
    </p>
</body>
</html>
